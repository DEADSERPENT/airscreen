<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- screen slab: vivid blue -> violet -> cyan -->
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.55" stop-color="#7B4DFF"/>
      <stop offset="1" stop-color="#16D2F0"/>
    </linearGradient>
    <linearGradient id="slabEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3FB8"/>
      <stop offset="1" stop-color="#5B2FD0"/>
    </linearGradient>
    <!-- glass body, rim and sheen -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1F55F0"/>
      <stop offset="1" stop-color="#8A4DFF"/>
    </linearGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3A4FD0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3A4FD0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </radialGradient>

    <filter id="blur28" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="blur10" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#2B2F8F" flood-opacity="0.32"/>
    </filter>
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2B2F8F" flood-opacity="0.35"/>
    </filter>

    <clipPath id="glassClip"><rect x="318" y="372" width="520" height="400" rx="84"/></clipPath>
  </defs>

  <!-- white canvas -->
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>

  <!-- floor shadow -->
  <ellipse cx="540" cy="850" rx="330" ry="52" fill="url(#floor)"/>

  <!-- 3D slab: extruded edge (depth) + face -->
  <g filter="url(#shadow)">
    <rect x="186" y="214" width="560" height="420" rx="88" fill="url(#slabEdge)" transform="translate(22 30)"/>
  </g>
  <rect x="186" y="214" width="560" height="420" rx="88" fill="url(#slab)" transform="translate(11 15)"/>
  <rect x="186" y="214" width="560" height="420" rx="88" fill="url(#slab)"/>
  <!-- slab top highlight -->
  <path d="M250 214 H682 A64 64 0 0 1 746 278 V300 Q470 250 186 330 V278 A64 64 0 0 1 250 214 Z" fill="#FFFFFF" opacity="0.16"/>

  <!-- frosted glass: blurred copy of what is behind it, clipped to the glass -->
  <g clip-path="url(#glassClip)">
    <g filter="url(#blur28)">
      <rect x="186" y="214" width="560" height="420" rx="88" fill="url(#slab)"/>
      <rect x="186" y="214" width="560" height="420" rx="88" fill="url(#slabEdge)" transform="translate(22 30)" opacity="0.7"/>
    </g>
    <rect x="318" y="372" width="520" height="400" fill="#FFFFFF" opacity="0.30"/>
  </g>
  <!-- glass thickness + body -->
  <rect x="318" y="372" width="520" height="400" rx="84" fill="url(#glassFill)" filter="url(#shadow)"/>
  <!-- diagonal sheen -->
  <g clip-path="url(#glassClip)">
    <path d="M318 372 H640 L420 772 H318 Z" fill="url(#sheen)" opacity="0.55"/>
  </g>
  <!-- bright rim -->
  <rect x="320" y="374" width="516" height="396" rx="82" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <rect x="332" y="386" width="492" height="372" rx="72" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

  <!-- wireless glyph: centred Wi-Fi fan (dot + three arcs) -->
  <g filter="url(#glyphShadow)" fill="none" stroke="url(#glyph)" stroke-linecap="round" stroke-width="38">
    <path d="M514.4 632.4 A90 90 0 0 1 641.6 632.4"/>
    <path d="M457.8 575.8 A170 170 0 0 1 698.2 575.8"/>
    <path d="M401.2 519.2 A250 250 0 0 1 754.8 519.2"/>
  </g>
  <circle cx="578" cy="696" r="32" fill="url(#glyph)" filter="url(#glyphShadow)"/>
  <!-- glyph gloss -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-linecap="round" stroke-width="7">
    <path d="M524 622 A80 80 0 0 1 580 606"/>
    <path d="M472 566 A158 158 0 0 1 570 526"/>
    <path d="M418 510 A238 238 0 0 1 560 450"/>
  </g>
  <ellipse cx="566" cy="686" rx="10" ry="6.5" fill="#FFFFFF" opacity="0.75"/>
</svg>

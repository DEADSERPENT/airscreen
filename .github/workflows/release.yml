name: Release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r sender/requirements.txt pyinstaller
      - run: pyinstaller scripts/AirScreen.spec --noconfirm
      - name: Get FFmpeg (GPL build, unmodified)
        shell: pwsh
        run: |
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 15 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe
      - name: Get the WebView2 runtime bootstrapper (installed only on PCs that lack it)
        shell: pwsh
        run: Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 15 https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile MicrosoftEdgeWebview2Setup.exe
      - run: choco install innosetup -y
      - shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DFFmpegExe=$PWD\ffmpeg.exe" "/DWebView2Setup=$PWD\MicrosoftEdgeWebview2Setup.exe" scripts\AirScreen.iss'
      - name: Microsoft Store package (unsigned; upload to Partner Center, which signs it)
        shell: pwsh
        run: ./scripts/build-msix.ps1 -FFmpeg "$PWD\ffmpeg.exe" -IdentityName "${{ vars.STORE_IDENTITY_NAME || 'Deadserpent.AirScreen' }}" -Publisher "${{ vars.STORE_PUBLISHER || 'CN=Deadserpent' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            installer/AirScreen-Setup-*.exe
            installer/AirScreen-*.msix
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('receiver/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Fetch Gradle (retry, then a checksum-verified mirror if GitHub's downloads are down)
        working-directory: receiver
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --version && exit 0; echo "retry $i"; sleep $((i*15)); done
          echo "GitHub download unavailable: using a mirror, verified against the published checksum"
          curl -fsSL --retry 3 -o /tmp/gradle-8.7-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
          echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  /tmp/gradle-8.7-bin.zip" | sha256sum -c -
          sed -i 's#^distributionUrl=.*#distributionUrl=file\:///tmp/gradle-8.7-bin.zip#; s#^validateDistributionUrl=.*#validateDistributionUrl=false#' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version
      - run: ./gradlew assembleDebug
        working-directory: receiver
      - run: cp receiver/app/build/outputs/apk/debug/app-debug.apk AirScreen-TV.apk
      - uses: actions/upload-artifact@v4
        with: { name: tv-apk, path: AirScreen-TV.apk }
  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "out/*", generate_release_notes: true }

name: Release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r sender/requirements.txt pyinstaller
      - run: pyinstaller scripts/AirScreen.spec --noconfirm
      - name: Get FFmpeg (GPL build, unmodified)
        shell: pwsh
        run: |
          Invoke-WebRequest -MaximumRetryCount 5 -RetryIntervalSec 15 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe
      - run: choco install innosetup -y
      - shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DFFmpegExe=$PWD\ffmpeg.exe" scripts\AirScreen.iss'
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: installer/AirScreen-Setup-*.exe }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('receiver/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Fetch Gradle (retries when GitHub's download servers return 5xx)
        working-directory: receiver
        run: |
          chmod +x gradlew
          for i in 1 2 3 4 5 6 7 8; do ./gradlew --version && exit 0; echo "retry $i"; sleep $((i*20)); done; exit 1
      - run: ./gradlew assembleDebug
        working-directory: receiver
      - run: cp receiver/app/build/outputs/apk/debug/app-debug.apk AirScreen-TV.apk
      - uses: actions/upload-artifact@v4
        with: { name: tv-apk, path: AirScreen-TV.apk }
  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "out/*", generate_release_notes: true }

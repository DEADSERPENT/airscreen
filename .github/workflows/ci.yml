name: CI
on: [push, pull_request]
jobs:
  sender:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: choco install ffmpeg -y --no-progress
      - run: pip install -r sender/requirements.txt
      - run: python -m pytest tests -q
        working-directory: sender
  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('receiver/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Fetch Gradle (retry, then a checksum-verified mirror if GitHub's downloads are down)
        working-directory: receiver
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --version && exit 0; echo "retry $i"; sleep $((i*15)); done
          echo "GitHub download unavailable: using a mirror, verified against the published checksum"
          curl -fsSL --retry 3 -o /tmp/gradle-8.7-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
          echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  /tmp/gradle-8.7-bin.zip" | sha256sum -c -
          sed -i 's#^distributionUrl=.*#distributionUrl=file\:///tmp/gradle-8.7-bin.zip#; s#^validateDistributionUrl=.*#validateDistributionUrl=false#' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version
      - run: ./gradlew assembleDebug testDebugUnitTest
        working-directory: receiver

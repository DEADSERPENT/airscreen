name: CI
on: [push, pull_request]
jobs:
  sender:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: choco install ffmpeg -y --no-progress
      - run: pip install -r sender/requirements.txt
      - run: python -m pytest tests -q
        working-directory: sender
  receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('receiver/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Fetch Gradle (retries when GitHub's download servers return 5xx)
        working-directory: receiver
        run: |
          chmod +x gradlew
          for i in 1 2 3 4 5 6 7 8; do ./gradlew --version && exit 0; echo "retry $i"; sleep $((i*20)); done; exit 1
      - run: ./gradlew assembleDebug testDebugUnitTest
        working-directory: receiver
